<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seifenblasen zerplatzen!</title>
    <style>
        :root {
            --circus-red: #d32f2f;
            --circus-gold: #ffc107;
            --sky-blue: #a1d9ff;
            --duck-yellow: #ffeb3b;
            --flower-pink: #ff4081;
            --danger-red: #ff1744;
            --font-main: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #2c3e50;
            color: #333;
            font-family: var(--font-main);
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to top, #fff9c4, var(--sky-blue));
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        .score-board {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 35px;
            border-radius: 12px;
            border: 3px solid var(--circus-red);
            font-size: clamp(20px, 5vw, 30px);
            font-weight: 700;
            color: var(--circus-red);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #penalty-flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--danger-red);
            font-size: 80px;
            font-weight: 900;
            text-shadow: 0 0 20px white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.3s;
        }

        #pimpinelly-container {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 300px;
            pointer-events: none;
            z-index: 10;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.7) 40%, transparent 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pimpinelly-img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px white); 
            animation: bounce 3.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-15px) rotate(1deg); }
        }

        #pimpinelly-speech {
            position: absolute;
            bottom: 260px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 12px 24px;
            border-radius: 12px;
            border: 2px solid var(--circus-red);
            font-size: 20px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 15;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-transform: uppercase;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(211, 47, 47, 0.98) 0%, rgba(150, 20, 20, 1) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 50;
            padding: 20px;
            text-align: center;
        }

        .title-img-wrapper {
            width: 80%;
            max-width: 400px;
            margin-bottom: 25px;
            border-radius: 15px;
            border: 5px solid var(--circus-gold);
            overflow: hidden;
            background: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.4);
        }

        #title-screen-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .hidden { display: none !important; }

        h1 {
            font-size: clamp(28px, 8vw, 48px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }

        .primary-btn {
            padding: 18px 60px;
            font-size: 26px;
            background: var(--circus-gold);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 0 #b79400;
            transition: all 0.1s;
        }

        .primary-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b79400;
        }

        .hint {
            margin-top: 25px;
            font-size: 16px;
            font-weight: 600;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Musik Element (Loop entfernt) -->
        <audio id="bgMusic" preload="auto">
            <source src="musik.mp3" type="audio/mpeg">
        </audio>

        <div id="ui">
            <div class="score-board">PUNKTE: <span id="score">0</span></div>
        </div>

        <div id="penalty-flash">-15!</div>
        <div id="pimpinelly-speech">PLOPP!</div>

        <div id="pimpinelly-container">
            <img id="pimpinelly-img" src="pimpinelly.svg" alt="Pimpinelly" onerror="this.style.opacity='0.5'">
        </div>

        <div id="overlay">
            <div class="title-img-wrapper">
                <img id="title-screen-img" src="bubblecatch.png" alt="Titelbild" onerror="this.style.display='none'">
            </div>
            <h1>SEIFENBLASEN ZERPLATZEN!</h1>
            <button class="primary-btn" id="startBtn">SPIEL STARTEN</button>
            <div class="hint">🦆 +10 | 🌸 +20 | 🎶 Musik | 🔴 -15!</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const speech = document.getElementById('pimpinelly-speech');
        const penaltyFlash = document.getElementById('penalty-flash');
        const bgMusic = document.getElementById('bgMusic');
        const startBtn = document.getElementById('startBtn');

        let gameActive = false;
        let score = 0;
        let bubbles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        startBtn.addEventListener('click', () => {
            startGame();
        });

        function startGame() {
            score = 0;
            bubbles = [];
            scoreElement.innerText = '0';
            gameActive = true;
            overlay.classList.add('hidden');
            animate();
        }

        function drawDuck(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = "#ffeb3b";
            ctx.beginPath(); ctx.arc(0, size/4, size/2.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(size/4, -size/10, size/4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#ff9800";
            ctx.beginPath(); ctx.moveTo(size/2, -size/10); ctx.lineTo(size/1.3, -size/20); ctx.lineTo(size/2, size/20); ctx.closePath(); ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath(); ctx.arc(size/2.8, -size/6, size/20, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawFlower(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            const petals = 6;
            ctx.fillStyle = "#ff4081";
            for (let i = 0; i < petals; i++) {
                ctx.rotate((Math.PI * 2) / petals);
                ctx.beginPath(); ctx.ellipse(size/3, 0, size/3, size/6, 0, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = "#ffc107";
            ctx.beginPath(); ctx.arc(0, 0, size/5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function drawNote(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = "#000";
            // Notenkopf
            ctx.beginPath();
            ctx.ellipse(-size/6, size/4, size/6, size/8, 0.4, 0, Math.PI * 2);
            ctx.fill();
            // Notenhals
            ctx.fillRect(size/20, -size/3, size/12, size/1.8);
            // Fähnchen
            ctx.beginPath();
            ctx.moveTo(size/20, -size/3);
            ctx.bezierCurveTo(size/3, -size/4, size/3, 0, size/20, size/10);
            ctx.lineWidth = size/10;
            ctx.stroke();
            ctx.restore();
        }

        function createBubble() {
            const radius = Math.random() * 20 + 30;
            const rand = Math.random();
            
            let type = 'normal';
            if (rand < 0.15) type = 'danger';
            else if (rand < 0.25) type = 'duck';
            else if (rand < 0.30) type = 'flower';
            else if (rand < 0.35) type = 'music'; // Goldene Musik-Blase
            
            bubbles.push({
                x: Math.random() * (canvas.width - radius * 2) + radius,
                y: canvas.height + radius,
                radius: radius,
                speed: type === 'danger' ? Math.random() * 3.5 + 2.5 : Math.random() * 2 + 1.5,
                hue: Math.random() * 360,
                type: type,
                wobble: Math.random() * Math.PI
            });
        }

        function animate() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (Math.random() < 0.05) createBubble();

            for (let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];
                b.y -= b.speed;
                b.x += Math.sin(b.y / 40 + b.wobble) * 2.2;

                ctx.save();
                
                if (b.type === 'duck') drawDuck(ctx, b.x, b.y, b.radius * 0.8);
                if (b.type === 'flower') drawFlower(ctx, b.x, b.y, b.radius * 0.7);
                if (b.type === 'music') drawNote(ctx, b.x, b.y, b.radius * 0.6);

                ctx.beginPath();
                if (b.type === 'danger') {
                    ctx.fillStyle = `rgba(255, 23, 68, 0.55)`;
                    ctx.strokeStyle = `rgba(255, 0, 0, 0.9)`;
                } else if (b.type === 'music') {
                    ctx.fillStyle = `rgba(255, 215, 0, 0.6)`;
                    ctx.strokeStyle = `rgba(218, 165, 32, 0.9)`;
                } else {
                    ctx.fillStyle = `hsla(${b.hue}, 80%, 85%, 0.35)`;
                    ctx.strokeStyle = `hsla(${b.hue}, 80%, 65%, 0.75)`;
                }
                ctx.lineWidth = 3;
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.ellipse(b.x - b.radius/2.5, b.y - b.radius/2.5, b.radius/4, b.radius/6, Math.PI/4, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();

                if (b.y < -b.radius) bubbles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }

        function checkHit(x, y) {
            for (let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];
                let dist = Math.sqrt((x - b.x)**2 + (y - b.y)**2);
                
                if (dist < b.radius + 15) {
                    if (b.type === 'danger') {
                        score = Math.max(0, score - 15);
                        showPenalty();
                    } else if (b.type === 'duck') {
                        score += 10;
                        showPlopp("ENTE! +10");
                    } else if (b.type === 'flower') {
                        score += 20;
                        showPlopp("BLUME! +20");
                    } else if (b.type === 'music') {
                        playMusicOnce();
                        showPlopp("MUSIK AB! 🎶");
                    } else {
                        score++;
                        showPlopp("PLOPP!");
                    }
                    bubbles.splice(i, 1);
                    scoreElement.innerText = score;
                    break;
                }
            }
        }

        function playMusicOnce() {
            bgMusic.pause();
            bgMusic.currentTime = 0; // Zurück zum Anfang
            bgMusic.play().catch(e => console.log("Audio Fehler:", e));
        }

        canvas.addEventListener('mousedown', (e) => { if (gameActive) checkHit(e.clientX, e.clientY); });
        canvas.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            e.preventDefault();
            checkHit(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        function showPlopp(text) {
            speech.innerText = text;
            speech.style.opacity = "1";
            speech.style.transform = "translateX(-50%) scale(1.1)";
            setTimeout(() => {
                speech.style.opacity = "0";
                speech.style.transform = "translateX(-50%) scale(1)";
            }, 800);
        }

        function showPenalty() {
            penaltyFlash.style.opacity = "1";
            speech.innerText = "HOPPLA! -15";
            speech.style.opacity = "1";
            setTimeout(() => {
                penaltyFlash.style.opacity = "0";
                speech.style.opacity = "0";
            }, 1000);
        }
    </script>
</body>
</html>
