<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pimpinellys Seifenblasen-Spaß</title>
    <style>
        :root {
            --circus-red: #d32f2f;
            --circus-gold: #ffc107;
            --sky-blue: #a1d9ff;
            --duck-yellow: #ffeb3b;
            --flower-pink: #ff4081;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #2c3e50;
            color: #333;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to top, #fff9c4, var(--sky-blue));
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }

        .score-board {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 30px;
            border-radius: 20px;
            border: 4px solid var(--circus-red);
            font-size: clamp(18px, 5vw, 28px);
            font-weight: bold;
            color: var(--circus-red);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Pimpinelly Container: Optimiert für SVG */
        #pimpinelly-container {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 280px;
            pointer-events: none;
            z-index: 10;
            /* Ein weicher Schein zur Hervorhebung */
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.5) 50%, transparent 75%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pimpinelly-img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            /* Filter zur besseren Abgrenzung */
            filter: drop-shadow(0 0 8px white); 
            animation: bounce 3.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        /* Sprachblase */
        #pimpinelly-speech {
            position: absolute;
            bottom: 250px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 12px 24px;
            border-radius: 25px;
            border: 3px solid var(--circus-red);
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 15;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(211, 47, 47, 0.95) 0%, rgba(150, 20, 20, 0.98) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 50;
            padding: 20px;
            text-align: center;
        }

        .title-img-wrapper {
            width: 85%;
            max-width: 450px;
            margin-bottom: 20px;
            border-radius: 25px;
            border: 6px solid var(--circus-gold);
            overflow: hidden;
            background: white;
            box-shadow: 0 0 40px rgba(0,0,0,0.3);
        }

        #title-screen-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .hidden { display: none !important; }

        .primary-btn {
            padding: 15px 50px;
            font-size: 28px;
            background: var(--circus-gold);
            color: var(--circus-red);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 0 #b79400;
        }

        .primary-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b79400;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div class="score-board">Punkte: <span id="score">0</span></div>
        </div>

        <div id="pimpinelly-speech">Plopp!</div>

        <div id="pimpinelly-container">
            <!-- Die neue SVG Datei von Pimpinelly -->
            <img id="pimpinelly-img" src="pimpinelly.svg" alt="Clownin Pimpinelly">
        </div>

        <div id="overlay">
            <div class="title-img-wrapper">
                <img id="title-screen-img" src="bubblecatch.png" alt="Titelbild">
            </div>
            <h1>BABBELS PLOPP!</h1>
            <button class="primary-btn" onclick="startGame()">SPIEL STARTEN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const speech = document.getElementById('pimpinelly-speech');

        let gameActive = false;
        let score = 0;
        let bubbles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function startGame() {
            score = 0;
            bubbles = [];
            scoreElement.innerText = '0';
            gameActive = true;
            overlay.classList.add('hidden');
            animate();
        }

        function createBubble() {
            const radius = Math.random() * 20 + 20;
            bubbles.push({
                x: Math.random() * (canvas.width - radius * 2) + radius,
                y: canvas.height + radius,
                radius: radius,
                speed: Math.random() * 2 + 1,
                hue: Math.random() * 360
            });
        }

        function animate() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (Math.random() < 0.03) createBubble();

            for (let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];
                b.y -= b.speed;
                b.x += Math.sin(b.y / 30) * 1.5;

                ctx.beginPath();
                ctx.fillStyle = `hsla(${b.hue}, 70%, 80%, 0.4)`;
                ctx.strokeStyle = `hsla(${b.hue}, 70%, 60%, 0.8)`;
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                if (b.y < -b.radius) bubbles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }

        canvas.addEventListener('click', (e) => {
            if (!gameActive) return;
            for (let i = bubbles.length - 1; i >= 0; i--) {
                let b = bubbles[i];
                let dist = Math.sqrt((e.clientX - b.x)**2 + (e.clientY - b.y)**2);
                if (dist < b.radius + 10) {
                    bubbles.splice(i, 1);
                    score++;
                    scoreElement.innerText = score;
                    showPlopp();
                    break;
                }
            }
        });

        function showPlopp() {
            speech.style.opacity = "1";
            speech.style.transform = "translateX(-50%) scale(1.1)";
            setTimeout(() => {
                speech.style.opacity = "0";
                speech.style.transform = "translateX(-50%) scale(1)";
            }, 600);
        }
    </script>
</body>
</html>
